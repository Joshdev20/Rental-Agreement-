<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin sign in - Rental Agreement Desk</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <main class="login-shell">
    <div class="login-card">
      <div class="login-card__head">
        <div class="appbar__mark" style="margin:0 auto 14px;width:42px;height:42px;font-size:18px">RA</div>
        <h1>Property manager sign in</h1>
        <p>Review submitted rental agreements and issue PDF documents.</p>
      </div>
      <div class="login-card__body">
        <div id="alerts"></div>
        <form id="login-form" class="stack" novalidate>
          <div class="field">
            <label for="email">Email address</label>
            <input type="email" id="email" name="email" autocomplete="username" required autofocus>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>
          </div>
          <button class="btn btn--primary btn--block" type="submit" id="btn-login">Sign in</button>
        </form>
      </div>
      <div class="login-card__foot">
        Authorised personnel only. Sessions expire automatically after 8 hours.
      </div>
    </div>
  </main>
  <script src="/js/login.js"></script>
</body>
</html>
