# Render blueprint. The disk is what makes this app work: SQLite and the
# generated PDFs need storage that outlives a single request.
# Disks require a paid instance type; the free plan has no persistent disk.
services:
  - type: web
    name: rental-agreement
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 24.11.0
      - key: DATA_DIR
        value: /var/data
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        sync: false
    disk:
      name: rental-data
      mountPath: /var/data
      sizeGB: 1
